name: Image du serveur

# L'image Docker du serveur sur ghcr.io, pour amd64 et arm64, signée
# (cosign, sans clé : l'identité est ce workflow) et attestée (provenance :
# quel dépôt, quel commit, quel workflow).
#
# - Après un CI vert sur `main` : `:main`, `:latest` et `:sha-<commit>` —
#   la branche `main` est la version maintenue du serveur (SECURITY.md).
# - Sur un tag `server-v<version>` : `:<version>` et `:<majeure>.<mineure>`.
#
# Chaque architecture se construit sur un runner natif (Rust sous QEMU
# prendrait plus d'une heure), poussée par empreinte ; le job `merge` en
# fait une seule image multi-architecture, puis la signe et l'atteste.
#
# Vérifier une image :
#   cosign verify ghcr.io/gulligulli28/guivault:latest \
#     --certificate-identity-regexp '^https://github.com/GulliGulli28/GuiVault/.github/workflows/server-image.yml@' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com
#   gh attestation verify oci://ghcr.io/gulligulli28/guivault:latest -R GulliGulli28/GuiVault

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags: ["server-v*"]
  workflow_dispatch:

# Une publication à la fois par branche ou tag, dans l'ordre : une image plus
# ancienne ne repose pas `:latest` après une plus récente (une seule reste en
# attente, la dernière).
concurrency:
  group: server-image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/gulligulli28/guivault

jobs:
  build:
    # Un CI rouge (ou lancé par une pull request) ne publie rien.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: GUIVAULT_BUILD_COMMIT=${{ github.event.workflow_run.head_sha || github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha || github.sha }}
            org.opencontainers.image.licenses=MIT
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=image-${{ matrix.platform }}
          cache-to: type=gha,scope=image-${{ matrix.platform }},mode=max
      - name: Retenir l'empreinte
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          d="${{ steps.build.outputs.digest }}"
          touch "$RUNNER_TEMP/digests/${d#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ strategy.job-index }}
          path: ${{ runner.temp }}/digests/*
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Étiquettes
        id: tags
        env:
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          tags="-t $IMAGE:sha-${SHA:0:12}"
          case "$GITHUB_REF" in
            refs/tags/server-v*)
              v="${GITHUB_REF#refs/tags/server-v}"
              tags="$tags -t $IMAGE:$v -t $IMAGE:$(echo "$v" | cut -d. -f1-2)" ;;
            *)
              tags="$tags -t $IMAGE:main -t $IMAGE:latest" ;;
          esac
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "sha_tag=$IMAGE:sha-${SHA:0:12}" >> "$GITHUB_OUTPUT"
      - name: Image multi-architecture
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create ${{ steps.tags.outputs.tags }} \
            $(printf "$IMAGE@sha256:%s " *)
      - name: Empreinte de l'image
        id: digest
        run: |
          d=$(docker buildx imagetools inspect "${{ steps.tags.outputs.sha_tag }}" --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=$d" >> "$GITHUB_OUTPUT"
          docker buildx imagetools inspect "$IMAGE@$d"
      - uses: sigstore/cosign-installer@v3
      - name: Signer (cosign, sans clé)
        run: cosign sign --yes "$IMAGE@${{ steps.digest.outputs.digest }}"
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true

  # L'image publiée sert-elle l'interface de son commit ? Elle est lancée,
  # et chaque fichier qu'elle sert est comparé au build de ce commit
  # (reproductible) — `scripts/verify-web.sh`, que chacun peut relancer
  # contre son propre serveur.
  verify:
    needs: merge
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: guivault
          POSTGRES_PASSWORD: verify
          POSTGRES_DB: guivault
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U guivault -d guivault"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Lancer l'image publiée
        run: |
          docker run -d --name guivault --network host \
            -e GUIVAULT_DATABASE_URL=postgres://guivault:verify@127.0.0.1:5432/guivault \
            -e GUIVAULT_SECRET=verify-only-verify-only-verify-only-verify \
            -e GUIVAULT_BIND=127.0.0.1:8080 \
            "$IMAGE@${{ needs.merge.outputs.digest }}"
          for i in $(seq 30); do curl -fsS http://127.0.0.1:8080/api/v1/health && break; sleep 2; done
      - name: L'interface servie est celle du commit
        run: scripts/verify-web.sh http://127.0.0.1:8080
      - if: failure()
        run: docker logs guivault

