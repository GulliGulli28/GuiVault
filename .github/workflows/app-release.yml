name: Application (release)

# Les installeurs Windows de l'application (`docs/APP.md`) : MSI et NSIS,
# publiés en **brouillon** de release sur un tag `app-v<version>` — les tags
# `v*` sont ceux du serveur. Publier le brouillon reste un geste humain.
#
# Pas signés pour Windows (pas de certificat de signature de code) :
# SmartScreen avertit à la première installation. Les sommes SHA-256 et
# l'attestation de provenance (quel workflow, quel commit) accompagnent
# chaque installeur.
#
# Mises à jour (`tauri-plugin-updater`) : avec le secret
# `TAURI_SIGNING_PRIVATE_KEY`, l'installeur NSIS est signé (`.sig`) et un
# `latest.json` joint à la release ; `app-updater.yml` le recopie dans la
# release `app-updater` — celle que lit l'application — quand celle-ci est
# **publiée**. Sans le secret : pas de mise à jour automatique, et on le dit.
on:
  push:
    tags:
      - "app-v*"
  workflow_dispatch:

# Jamais annulé : une construction interrompue à mi-chemin publierait une
# release à qui il manque un installeur.
concurrency:
  group: app-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app-tauri -> target

      # Un tag qui ne dit pas la version de `tauri.conf.json` donnerait des
      # installeurs nommés d'une version sous une release d'une autre.
      - name: Le tag est la version de l'app
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          v=$(node -p "require('./app-tauri/tauri.conf.json').version")
          if [ "$GITHUB_REF_NAME" != "app-v$v" ]; then
            echo "::error::le tag $GITHUB_REF_NAME ne correspond pas à la version $v de app-tauri/tauri.conf.json (attendu : app-v$v)"
            exit 1
          fi

      - run: npm ci --no-audit --no-fund
        working-directory: web

      # `tauri build` lance lui-même `npm --prefix web run build:app` (depuis
      # la racine du dépôt), compile en release avec `custom-protocol`, puis
      # empaquette MSI (WiX) et NSIS — signés pour l'updater si la clé est là.
      - name: Installeurs
        shell: bash
        working-directory: app-tauri
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            ../web/node_modules/.bin/tauri build --config '{"bundle":{"createUpdaterArtifacts":true}}'
          else
            echo "::warning title=Mises à jour désactivées::secret TAURI_SIGNING_PRIVATE_KEY absent — installeurs non signés pour l'updater, pas de latest.json (docs/APP.md, « Mises à jour »)."
            ../web/node_modules/.bin/tauri build
          fi

      # Ce que lit l'updater : la version, la signature de l'installeur NSIS
      # et son adresse dans **cette** release.
      - name: latest.json
        shell: bash
        working-directory: app-tauri/target/release/bundle/nsis
        run: |
          sig=$(ls *-setup.exe.sig 2>/dev/null | head -1)
          [ -n "$sig" ] || { echo "pas de signature : pas de latest.json"; exit 0; }
          exe="${sig%.sig}"
          v=$(node -p "require('../../../../tauri.conf.json').version")
          tag="${GITHUB_REF_NAME:-app-v$v}"
          node -e '
            const fs = require("fs");
            const [v, tag, exe, sig, repo] = process.argv.slice(1);
            fs.writeFileSync("latest.json", JSON.stringify({
              version: v,
              notes: `GuiVault ${v} — https://github.com/${repo}/releases/tag/${tag}`,
              pub_date: new Date().toISOString(),
              platforms: { "windows-x86_64": { signature: fs.readFileSync(sig, "utf8").trim(), url: `https://github.com/${repo}/releases/download/${tag}/${encodeURIComponent(exe)}` } },
            }, null, 2));
          ' "$v" "$tag" "$exe" "$sig" "${{ github.repository }}"
          cat latest.json

      - name: Sommes SHA-256
        shell: bash
        working-directory: app-tauri/target/release/bundle
        run: sha256sum msi/*.msi nsis/*-setup.exe | tee SHA256SUMS.txt

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            app-tauri/target/release/bundle/msi/*.msi
            app-tauri/target/release/bundle/nsis/*-setup.exe

      - name: Brouillon de release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          b=app-tauri/target/release/bundle
          extra=$(ls $b/nsis/latest.json $b/nsis/*-setup.exe.sig 2>/dev/null || true)
          # `--latest=false` : « Latest » reste la release du serveur.
          gh release create "$GITHUB_REF_NAME" --draft --latest=false \
            --title "GuiVault — application ${GITHUB_REF_NAME#app-v}" \
            --notes "Installeurs Windows de l'application GuiVault (coffre local, ou connexion à un serveur GuiVault). Non signés : SmartScreen avertit à la première installation. Vérifier : SHA256SUMS.txt, ou \`gh attestation verify <fichier> -R ${{ github.repository }}\`." \
            $b/msi/*.msi $b/nsis/*-setup.exe $b/SHA256SUMS.txt $extra

      # Sans tag (lancé à la main) : les installeurs restent téléchargeables
      # depuis l'exécution.
      - uses: actions/upload-artifact@v4
        with:
          name: guivault-app-windows
          path: |
            app-tauri/target/release/bundle/msi/*.msi
            app-tauri/target/release/bundle/nsis/*-setup.exe
            app-tauri/target/release/bundle/SHA256SUMS.txt
          retention-days: 14
