name: Application (release)

# Les installeurs Windows de l'application (`docs/APP.md`) : MSI et NSIS,
# publiés en **brouillon** de release sur un tag `app-v<version>` — les tags
# `v*` sont ceux du serveur. Publier le brouillon reste un geste humain.
#
# Pas signés pour Windows (pas de certificat de signature de code) :
# SmartScreen avertit à la première installation. Les sommes SHA-256 et
# l'attestation de provenance (quel workflow, quel commit) accompagnent
# chaque installeur.
#
# Android (`docs/ANDROID.md`) : un APK de release (arm64, x86_64) signé par
# la clé des secrets `ANDROID_KEYSTORE_BASE64` / `ANDROID_KEYSTORE_PASSWORD`,
# joint au même brouillon avec son attestation — job `android`, après
# `windows` qui crée le brouillon.
#
# Mises à jour (`tauri-plugin-updater`) : avec le secret
# `TAURI_SIGNING_PRIVATE_KEY`, l'installeur NSIS est signé (`.sig`) et un
# `latest.json` joint à la release ; `app-updater.yml` le recopie dans la
# release `app-updater` — celle que lit l'application — quand celle-ci est
# **publiée**. Sans le secret : pas de mise à jour automatique, et on le dit.
on:
  push:
    tags:
      - "app-v*"
  workflow_dispatch:

# Jamais annulé : une construction interrompue à mi-chemin publierait une
# release à qui il manque un installeur.
concurrency:
  group: app-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app-tauri -> target

      # Un tag qui ne dit pas la version de `tauri.conf.json` donnerait des
      # installeurs nommés d'une version sous une release d'une autre.
      - name: Le tag est la version de l'app
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          v=$(node -p "require('./app-tauri/tauri.conf.json').version")
          if [ "$GITHUB_REF_NAME" != "app-v$v" ]; then
            echo "::error::le tag $GITHUB_REF_NAME ne correspond pas à la version $v de app-tauri/tauri.conf.json (attendu : app-v$v)"
            exit 1
          fi

      - run: npm ci --no-audit --no-fund
        working-directory: web

      # `tauri build` lance lui-même `npm --prefix web run build:app` (depuis
      # la racine du dépôt), compile en release avec `custom-protocol`, puis
      # empaquette MSI (WiX) et NSIS — signés pour l'updater si la clé est là.
      - name: Installeurs
        shell: bash
        working-directory: app-tauri
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            ../web/node_modules/.bin/tauri build --config '{"bundle":{"createUpdaterArtifacts":true}}'
          else
            echo "::warning title=Mises à jour désactivées::secret TAURI_SIGNING_PRIVATE_KEY absent — installeurs non signés pour l'updater, pas de latest.json (docs/APP.md, « Mises à jour »)."
            ../web/node_modules/.bin/tauri build
          fi

      # Ce que lit l'updater : la version, la signature de l'installeur NSIS
      # et son adresse dans **cette** release.
      - name: latest.json
        shell: bash
        working-directory: app-tauri/target/release/bundle/nsis
        run: |
          sig=$(ls *-setup.exe.sig 2>/dev/null | head -1)
          [ -n "$sig" ] || { echo "pas de signature : pas de latest.json"; exit 0; }
          exe="${sig%.sig}"
          v=$(node -p "require('../../../../tauri.conf.json').version")
          tag="${GITHUB_REF_NAME:-app-v$v}"
          node -e '
            const fs = require("fs");
            const [v, tag, exe, sig, repo] = process.argv.slice(1);
            fs.writeFileSync("latest.json", JSON.stringify({
              version: v,
              notes: `GuiVault ${v} — https://github.com/${repo}/releases/tag/${tag}`,
              pub_date: new Date().toISOString(),
              platforms: { "windows-x86_64": { signature: fs.readFileSync(sig, "utf8").trim(), url: `https://github.com/${repo}/releases/download/${tag}/${encodeURIComponent(exe)}` } },
            }, null, 2));
          ' "$v" "$tag" "$exe" "$sig" "${{ github.repository }}"
          cat latest.json

      - name: Sommes SHA-256
        shell: bash
        working-directory: app-tauri/target/release/bundle
        run: sha256sum msi/*.msi nsis/*-setup.exe | tee SHA256SUMS.txt

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            app-tauri/target/release/bundle/msi/*.msi
            app-tauri/target/release/bundle/nsis/*-setup.exe

      - name: Brouillon de release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          b=app-tauri/target/release/bundle
          extra=$(ls $b/nsis/latest.json $b/nsis/*-setup.exe.sig 2>/dev/null || true)
          # `--latest=false` : « Latest » revient aux releases du serveur (GitHub la
          # donne quand même à une release app tant qu'elle est la seule).
          gh release create "$GITHUB_REF_NAME" --draft --latest=false \
            --title "GuiVault — application ${GITHUB_REF_NAME#app-v}" \
            --notes "Installeurs Windows de l'application GuiVault (coffre local, ou connexion à un serveur GuiVault). Non signés : SmartScreen avertit à la première installation. Vérifier : SHA256SUMS.txt, ou \`gh attestation verify <fichier> -R ${{ github.repository }}\`." \
            $b/msi/*.msi $b/nsis/*-setup.exe $b/SHA256SUMS.txt $extra

      # Sans tag (lancé à la main) : les installeurs restent téléchargeables
      # depuis l'exécution.
      - uses: actions/upload-artifact@v4
        with:
          name: guivault-app-windows
          path: |
            app-tauri/target/release/bundle/msi/*.msi
            app-tauri/target/release/bundle/nsis/*-setup.exe
            app-tauri/target/release/bundle/SHA256SUMS.txt
          retention-days: 14

  android:
    needs: windows
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app-tauri -> target
          key: android
      # `cargo tauri` : Gradle rappelle le CLI comme il a été lancé, et
      # `cargo tauri android android-studio-script` marche de n'importe où.
      - name: CLI Tauri
        run: cargo install tauri-cli --version "^2" --locked

      - run: npm ci --no-audit --no-fund
        working-directory: web

      # La clé de signature, là où `gen/android/app/build.gradle.kts` la
      # cherche. Sans les secrets : un APK non signé, et on le dit.
      - name: Clé de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning title=APK non signé::secrets ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD absents (docs/ANDROID.md, « Signature »)."
            exit 0
          fi
          dir="$HOME/.guivault-android"
          mkdir -p "$dir"
          echo "$KEYSTORE_BASE64" | base64 -d > "$dir/guivault-release.jks"
          printf 'storeFile=%s\npassword=%s\nkeyAlias=guivault\n' "$dir/guivault-release.jks" "$KEYSTORE_PASSWORD" > "$dir/keystore.properties"

      # `beforeBuildCommand` construit `web/dist-app` (depuis la racine).
      - name: APK
        working-directory: app-tauri
        run: |
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          cargo tauri android build --apk --target aarch64 --target x86_64

      - name: Nommer et vérifier
        id: apk
        env:
          SIGNED: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          v=$(node -p "require('./app-tauri/tauri.conf.json').version")
          out="GuiVault_${v}_android.apk"
          cp app-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk "$out"
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          if [ "$SIGNED" = "true" ]; then
            "$bt/apksigner" verify --print-certs "$out" | head -3
          fi
          sha256sum "$out"
          echo "file=$out" >> "$GITHUB_OUTPUT"

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ steps.apk.outputs.file }}

      # Dans le brouillon que `windows` vient de créer : l'APK, sa somme dans
      # SHA256SUMS.txt, et une ligne dans les notes.
      - name: Joindre au brouillon
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APK: ${{ steps.apk.outputs.file }}
        run: |
          gh release upload "$GITHUB_REF_NAME" "$APK" --clobber
          gh release download "$GITHUB_REF_NAME" -p SHA256SUMS.txt -D sums
          sha256sum "$APK" | sed 's/  / */' >> sums/SHA256SUMS.txt
          gh release upload "$GITHUB_REF_NAME" sums/SHA256SUMS.txt --clobber
          notes=$(gh release view "$GITHUB_REF_NAME" --json body -q .body)
          gh release edit "$GITHUB_REF_NAME" --notes "$notes

          Android : \`$APK\` (arm64, x86_64), à installer à la main ; serveur en HTTPS. Signé par la clé GuiVault ; vérifier : SHA256SUMS.txt ou \`gh attestation verify $APK -R ${{ github.repository }}\`."

      - uses: actions/upload-artifact@v4
        with:
          name: guivault-app-android
          path: ${{ steps.apk.outputs.file }}
          retention-days: 14
