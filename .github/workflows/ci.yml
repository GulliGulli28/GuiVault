name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: guivault
          POSTGRES_PASSWORD: test
          POSTGRES_DB: guivault_test
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U guivault -d guivault_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all
        env:
          GUIVAULT_TEST_DATABASE_URL: postgres://guivault:test@localhost:55432/guivault_test

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npm run build:ext

  # Le remplissage de l'extension, rejoué dans un vrai Chromium face au
  # corpus de pages piégeuses (`web/extension/e2e`).
  extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ext
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: extension-e2e
          path: web/test-results
          retention-days: 7

  # L'application (`app-tauri`, `docs/APP.md`) : son workspace Cargo à part,
  # l'interface de l'app, puis le vrai binaire piloté par WebDriver
  # (`web/app/e2e/run.mjs`) — de vrais `invoke` vers un vrai coffre sur le
  # disque. Linux et WebKitGTK sous Xvfb : rien de ce qui est propre à
  # WebView2 (ce que lancent les utilisateurs Windows) ; ça, c'est le passage
  # local sous Windows qui le couvre (`docs/APP.md`).
  app:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app-tauri -> target
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      # Compiler Tauri (`-dev`), le pilote natif que tauri-driver commande
      # (`webkit2gtk-driver` : /usr/bin/WebKitWebDriver), un écran (`xvfb`).
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf webkit2gtk-driver xvfb
      - id: tauri-driver-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/tauri-driver
          key: tauri-driver-2.0.6-${{ runner.os }}
      - if: steps.tauri-driver-cache.outputs.cache-hit != 'true'
        run: cargo install tauri-driver --version 2.0.6 --locked
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - run: npm run build:app
        working-directory: web
      - run: cargo fmt --check && cargo clippy --all-targets -- -D warnings && cargo build
        working-directory: app-tauri
      # Profondeur 24 bits explicite : à 8, WebKit rend mal ou pas du tout.
      - run: xvfb-run -a -s "-screen 0 1920x1080x24" npm run test:app
        working-directory: web
      # L'extension sur un coffre local, par l'hôte natif : il lui faut le
      # binaire de l'app, construit juste au-dessus (`native.spec.ts`).
      - run: npx playwright install --with-deps chromium && npm run test:ext -- native
        working-directory: web
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: app-e2e
          path: web/app/e2e/.output
          # `.output` commence par un point : upload-artifact v4 l'ignorerait.
          include-hidden-files: true
          retention-days: 7

  # Le code propre à Windows (saisie automatique, presse-papiers, zone de
  # notification) n'est compilé que là : clippy et le binaire release. Son
  # E2E dans WebView2 est un workflow à part (`app-windows-e2e.yml`).
  app-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app-tauri -> target
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - run: npm run build:app
        working-directory: web
      - run: cargo clippy --all-targets -- -D warnings && cargo build --release --features tauri/custom-protocol
        working-directory: app-tauri

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
