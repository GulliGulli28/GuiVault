name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: guivault
          POSTGRES_PASSWORD: test
          POSTGRES_DB: guivault_test
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U guivault -d guivault_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all
        env:
          GUIVAULT_TEST_DATABASE_URL: postgres://guivault:test@localhost:55432/guivault_test

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npm run build:ext

  # Le remplissage de l'extension, rejoué dans un vrai Chromium face au
  # corpus de pages piégeuses (`web/extension/e2e`).
  extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ext
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: extension-e2e
          path: web/test-results
          retention-days: 7

  # L'application (`app-tauri`, `docs/APP.md`) : son workspace Cargo à part,
  # l'interface de l'app, puis le vrai binaire piloté par WebDriver
  # (`web/app/e2e/run.mjs`) — de vrais `invoke` vers un vrai coffre sur le
  # disque. Linux et WebKitGTK sous Xvfb : rien de ce qui est propre à
  # WebView2 (ce que lancent les utilisateurs Windows) ; ça, c'est le passage
  # local sous Windows qui le couvre (`docs/APP.md`).
  app:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app-tauri -> target
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      # Compiler Tauri (`-dev`), le pilote natif que tauri-driver commande
      # (`webkit2gtk-driver` : /usr/bin/WebKitWebDriver), un écran (`xvfb`).
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf webkit2gtk-driver xvfb
      - id: tauri-driver-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/tauri-driver
          key: tauri-driver-2.0.6-${{ runner.os }}
      - if: steps.tauri-driver-cache.outputs.cache-hit != 'true'
        run: cargo install tauri-driver --version 2.0.6 --locked
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - run: npm run build:app
        working-directory: web
      - run: cargo fmt --check && cargo clippy --all-targets -- -D warnings && cargo build
        working-directory: app-tauri
      # Profondeur 24 bits explicite : à 8, WebKit rend mal ou pas du tout.
      - run: xvfb-run -a -s "-screen 0 1920x1080x24" npm run test:app
        working-directory: web
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: app-e2e
          path: web/app/e2e/.output
          retention-days: 7

  # La même suite dans WebView2, ce que lancent les utilisateurs Windows :
  # binaire release qui embarque `web/dist-app`. Le runner E2E prend lui-même
  # le msedgedriver de la version de WebView2 du runner (signature vérifiée).
  app-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app-tauri -> target
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - id: tauri-driver-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/tauri-driver.exe
          key: tauri-driver-2.0.6-${{ runner.os }}
      - if: steps.tauri-driver-cache.outputs.cache-hit != 'true'
        run: cargo install tauri-driver --version 2.0.6 --locked
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - run: npm run build:app
        working-directory: web
      # La saisie automatique (`SendInput`) n'est compilée que sous Windows :
      # c'est ici seulement que clippy la voit.
      - run: cargo clippy --all-targets -- -D warnings && cargo build --release --features tauri/custom-protocol
        working-directory: app-tauri
      # Diagnostic (20 octobre 2026) : la session WebDriver ne se créait pas
      # (« DevToolsActivePort file doesn't exist »), l'app ne démarrant pas
      # son WebView2. Le runtime WebView2 est-il seulement installé ? Une
      # app Tauri n'embarque son installeur que dans les MSI/NSIS, pas dans
      # le .exe nu. Il est installé ici s'il manque, puis le binaire est
      # lancé seul : vit-il, ses processus WebView2, sa sortie d'erreur.
      - name: WebView2 et premier lancement (diagnostic)
        shell: pwsh
        run: |
          $wv2 = '{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'; $edge = '{56EB18F8-B008-4CBD-B6D2-8C97FE7E9062}'
          function Pv($k) { (Get-ItemProperty $k -ErrorAction SilentlyContinue).pv }
          $runtime = @(Pv "HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\$wv2"; Pv "HKCU:\Software\Microsoft\EdgeUpdate\Clients\$wv2") | Where-Object { $_ -and $_ -ne '0.0.0.0' } | Select-Object -First 1
          "WebView2 Runtime : $(if ($runtime) { $runtime } else { 'ABSENT' }) ; Edge : $(Pv "HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\$edge")"
          if (-not $runtime) {
            "Installation du runtime WebView2 (Evergreen, Microsoft)…"
            Invoke-WebRequest -Uri 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile "$env:RUNNER_TEMP\wv2.exe"
            Start-Process "$env:RUNNER_TEMP\wv2.exe" -ArgumentList '/silent','/install' -Wait
            "WebView2 Runtime après installation : $(Pv "HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\$wv2")"
          }
          $p = Start-Process "app-tauri\target\release\guivault-app.exe" -PassThru -RedirectStandardError "$env:RUNNER_TEMP\err.txt" -RedirectStandardOutput "$env:RUNNER_TEMP\out.txt"
          Start-Sleep -Seconds 15
          "guivault-app vivant après 15 s : $(-not $p.HasExited)$(if ($p.HasExited) { ' (code ' + $p.ExitCode + ')' })"
          Get-Process guivault-app, msedgewebview2 -ErrorAction SilentlyContinue | Format-Table Name, Id, MainWindowTitle -AutoSize | Out-String
          "--- sortie d'erreur :"; Get-Content "$env:RUNNER_TEMP\err.txt" -ErrorAction SilentlyContinue
          Get-Process guivault-app, msedgewebview2 -ErrorAction SilentlyContinue | Stop-Process -Force
          exit 0
      - run: node app/e2e/run.mjs
        working-directory: web
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}\app-tauri\target
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: app-e2e-windows
          path: web/app/e2e/.output
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
