# Les avis de sécurité examinés et acceptés, avec la raison (`cargo audit`,
# workflow « Security »). Tout avis nouveau fait échouer le contrôle.
[advisories]
ignore = [
    # rsa 0.9 (« Marvin Attack », fuite de temps des opérations à clé
    # privée) — pas de correctif publié. Le serveur n'en fait que la
    # vérification de signatures WebAuthn RS256 (`src/webauthn.rs`), avec des
    # clés publiques : aucun secret, rien à faire fuir. L'application
    # (`app-tauri/src/ssh_agent/`) signe avec des clés RSA du coffre, sur le
    # poste : toujours avec un aléa (aveuglement de `rsa`), et chaque
    # signature est confirmée par l'utilisateur — on n'en obtient pas les
    # milliers qu'une mesure de temps demanderait. À revoir quand `rsa`
    # publie un correctif. https://rustsec.org/advisories/RUSTSEC-2023-0071
    "RUSTSEC-2023-0071",

    # crypto-bigint 0.5.5, tiré par p256 0.13 (vérification WebAuthn ES256) :
    # des opérations censées être à temps constant ne le sont pas toutes. Le
    # correctif est dans la 0.7, qui demande p256 0.14 (pas encore publiée en
    # stable). Même raison que ci-dessus : le serveur ne vérifie que des
    # signatures avec des clés publiques. https://rustsec.org/advisories/RUSTSEC-2026-0387
    "RUSTSEC-2026-0387",

    # libsqlite3-sys 0.30.1 (SQLite en C, CVE-2026-119375) : présent dans
    # `Cargo.lock` seulement, par `sqlx-sqlite`, que `sqlx-macros-core`
    # déclare en option — aucun crate n'active SQLite (Postgres seul), rien
    # n'est compilé (`cargo tree -i libsqlite3-sys --target all -e all` est
    # vide). Le correctif demande sqlx 0.9, alors que sqlx reste aligné sur
    # Guiterm (0.8). https://rustsec.org/advisories/RUSTSEC-2026-0459
    "RUSTSEC-2026-0459",
]
