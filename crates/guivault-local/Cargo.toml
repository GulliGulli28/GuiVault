[package]
name = "guivault-local"
description = "Le coffre local de GuiVault : un dossier qui garde exactement ce que garde le serveur (items chiffrés, enveloppes, manifeste), sans clé ni crypto."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Seulement pour ses types et constantes (`KdfParams`, `MANIFEST_TYPE`, taille
# des morceaux de pièces jointes) : ce crate ne chiffre ni ne déchiffre rien.
guivault-crypto.workspace = true
guivault-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
thiserror.workspace = true
chrono = { version = "0.4", features = ["serde"] }


[dev-dependencies]
base64.workspace = true
