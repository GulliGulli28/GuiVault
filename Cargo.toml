[workspace]
resolver = "3"
members = [
    "crates/guivault-crypto",
    "crates/guivault-protocol",
    "crates/guivault-items",
    "crates/guivault-server",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/GulliGulli28/GuiVault"

# Les versions des crates crypto sont volontairement alignées sur celles que
# Guiterm résout déjà (`argon2 0.5`, `chacha20poly1305 0.10`, `base64 0.22`,
# `sqlx 0.8`, `zeroize 1`) : `guivault-crypto` et `guivault-protocol` ont
# vocation à être consommés par Guiterm en dépendance git, et deux versions
# majeures d'une même crate crypto dans un seul binaire, c'est du poids et
# des types incompatibles pour rien.
[workspace.dependencies]
guivault-crypto = { path = "crates/guivault-crypto" }
guivault-protocol = { path = "crates/guivault-protocol" }
guivault-items = { path = "crates/guivault-items" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
base64 = "0.22"
zeroize = { version = "1", features = ["derive"] }
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Crypto (client-side primitives, également utilisées par le serveur pour
# hacher les jetons et le hash d'authentification).
argon2 = { version = "0.5", features = ["std"] }
chacha20poly1305 = "0.10"
crypto_box = { version = "0.9", features = ["seal", "std"] }
# X25519 brut pour les enveloppes de vault key authentifiées (format 2) —
# déjà tiré par `crypto_box`, même version que chez Guiterm.
curve25519-dalek = "4.1"
hkdf = "0.12"
sha2 = "0.10"
hmac = "0.12"
subtle = "2"
getrandom = { version = "0.4", features = ["sys_rng"] }

[profile.release]
lto = "thin"
strip = true
