<!doctype html><meta charset="utf-8"><title>Banque — changer de mot de passe</title><script src="/kit.js"></script>
<form onsubmit="event.preventDefault()">
  <input id="u" type="text" autocomplete="username" value="" hidden>
  <label>Mot de passe actuel <input id="cur" type="password" autocomplete="current-password"></label>
  <label>Nouveau mot de passe <input id="n1" type="password" autocomplete="new-password"></label>
  <label>Confirmer <input id="n2" type="password" autocomplete="new-password"></label>
  <button>Changer</button>
</form>
<script>field("current", cur); field("new", n1); field("confirm", n2);</script>
