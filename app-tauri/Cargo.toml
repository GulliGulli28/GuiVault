# L'application GuiVault (`docs/APP.md`) : Windows d'abord, Android ensuite.
#
# Workspace À PART, comme `rdp-sidecar` chez Guiterm : `cargo test` à la racine
# du dépôt reste la boucle du serveur, sans tauri, wry ni NDK Android. Ce
# crate ne dépend que de `guivault-local` (le coffre local, sans crypto) — la
# crypto est celle de l'interface web, embarquée (`web/dist-app`).
[workspace]

[package]
name = "guivault-app"
description = "GuiVault : se connecter à un serveur GuiVault, ou ouvrir un coffre local."
version = "0.2.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/GulliGulli28/GuiVault"

[[bin]]
name = "guivault-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
# La saisie automatique (`src/autotype.rs`) : le raccourci global, le texte
# effacé de la mémoire une fois tapé.
tauri-plugin-global-shortcut = "2"
# La zone de notification (`src/tray.rs`) : une seule instance (relancer
# ramène la fenêtre), démarrer avec la session.
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
# Les mises à jour (Paramètres › Application) : installeurs signés, vérifiés
# contre la clé publique de `tauri.conf.json` ; relancer après installation.
tauri-plugin-updater = { version = "2", default-features = false, features = ["rustls-tls"] }
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
zeroize = "1"
guivault-local = { path = "../crates/guivault-local" }
serde_json = "1"
# Même contrainte de résolution que chez Guiterm : cookie 0.18.1 (tiré par
# tauri/wry) appelle une API de `time` que 0.3.48 a cassée. Jamais `use`ée.
time = "=0.3.47"

# Taper dans une autre fenêtre (`SendInput`), savoir laquelle est au premier
# plan : l'API Win32, déjà dans l'arbre de Tauri.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_RemoteDesktop",
    "Win32_System_SystemInformation",
    "Win32_UI_Shell",
    "Win32_System_Registry",
] }

[profile.release]
lto = "thin"
strip = true
