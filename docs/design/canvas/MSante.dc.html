<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Mobile — santé</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./theme.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="gv phone" data-theme="{{theme}}" style="font-family: 'Geist', system-ui, sans-serif">
  <header class="m-head">
    <h1 class="m-title grow trunc">Santé</h1>
    <button type="button" class="m-icon" aria-label="Comment l'analyse est faite" style="color: var(--muted)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v5M12 8h.01"></path></svg></button>
  </header>

  <div class="m-body" style="gap: 16px">
    <div class="m-card" style="padding: 18px; display: flex; flex-direction: column; gap: 14px">
      <div style="display: flex; align-items: baseline; gap: 6px"><span style="font-size: 48px; font-weight: 600; letter-spacing: -0.04em; line-height: 1">72</span><span class="muted">/ 100</span></div>
      <div class="bar" role="img" aria-label="28 sains, 4 faibles, 2 réutilisés"><span style="flex: 28; background: var(--ok)"></span><span style="flex: 4; background: var(--warn)"></span><span style="flex: 2; background: var(--danger)"></span></div>
      <div style="display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px" class="t2">
        <span class="legend"><i style="background: var(--ok)"></i>28 sains</span>
        <span class="legend"><i style="background: var(--warn)"></i>4 faibles</span>
        <span class="legend"><i style="background: var(--danger)"></i>2 réutilisés</span>
      </div>
      <button type="button" class="m-btn" style="width: 100%"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>Vérifier les fuites</button>
    </div>

    <div class="m-chips">
      <button type="button" class="m-chip" aria-pressed="true">À traiter 8</button>
      <button type="button" class="m-chip" aria-pressed="false">Réutilisés 2</button>
      <button type="button" class="m-chip" aria-pressed="false">Faibles 4</button>
      <button type="button" class="m-chip" aria-pressed="false">2FA 2</button>
    </div>

    <div class="m-list">
      <sc-for list="{{issues}}" as="i" hint-placeholder-count="4">
        <a href="MFiche.dc.html" class="m-row" style="align-items: flex-start; padding: 12px 0">
          <span class="tile {{i.hue}}" style="width: 40px; height: 40px; border-radius: 11px; font-size: 15px">{{i.initial}}</span>
          <span class="stack grow" style="gap: 4px">
            <span class="trunc" style="font-weight: 500">{{i.name}}</span>
            <span class="clamp2 muted" style="font-size: 14px">{{i.detail}}</span>
            <span><span class="chip {{i.chip}}">{{i.kind}}</span></span>
          </span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="margin-top: 12px"><path d="M9 6l6 6-6 6"></path></svg>
        </a>
      </sc-for>
    </div>
  </div>

  <nav class="m-nav" aria-label="Principal">
    <a href="MAccueil.dc.html" class="m-tab"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10.5L12 4l8 6.5V19a1 1 0 0 1-1 1h-4.5v-6h-5v6H5a1 1 0 0 1-1-1z"></path></svg>Accueil</a>
    <a href="MCoffre.dc.html" class="m-tab"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2.5"></rect><circle cx="12" cy="12" r="3.5"></circle></svg>Coffres</a>
    <a href="MCodes.dc.html" class="m-tab"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 7.5V12l3 2"></path></svg>Codes</a>
    <a href="MSante.dc.html" class="m-tab" aria-current="page"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l7 3v5.5c0 4.5-3 7.8-7 9.5-4-1.7-7-5-7-9.5V6z"></path></svg>Santé</a>
    <a href="MParametres.dc.html" class="m-tab"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"></path><circle cx="16" cy="7" r="2"></circle><circle cx="10" cy="17" r="2"></circle></svg>Réglages</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const rows = [
      ['Gitlab interne', 'Même mot de passe que « AWS Console — compte de production principal »', 'Réutilisé', 'chip-danger', 'h-orange'],
      ['AWS Console — compte de production principal', 'Même mot de passe que « Gitlab interne »', 'Réutilisé', 'chip-danger', 'h-amber'],
      ['Netflix', '6 caractères, un mot du dictionnaire', 'Faible', 'chip-warn', 'h-red'],
      ['Figma', 'Le site accepte un code TOTP', '2FA possible', 'chip-accent', 'h-violet']
    ];
    return {
      theme: this.props.theme ?? 'dark',
      issues: rows.map((r) => ({ name: r[0], detail: r[1], kind: r[2], chip: r[3], hue: r[4], initial: r[0].charAt(0).toUpperCase() }))
    };
  }
}
</script>
</body>
</html>
