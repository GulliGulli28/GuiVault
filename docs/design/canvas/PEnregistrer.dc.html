<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Extension — enregistrer l'identifiant</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./theme.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="gv site" data-theme="{{theme}}">
  <div class="site-bar">
    <span class="site-url"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>https://compte.atelier-nord.test/tableau-de-bord</span>
    <span class="site-ext"><img src="/_blob/b5ba6fd6f3698d6072b814fdc9c6af28" alt="GuiVault" width="20" height="20"></span>
  </div>
  <div style="flex: 1 1 0; display: flex; flex-direction: column; gap: 20px; padding: 32px 48px">
    <div class="site-brand"><svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><path d="M4 22L14 5l10 17z" fill="#24453A"></path><path d="M10 22l4-7 4 7z" fill="#EEF0EC"></path></svg>Atelier Nord</div>
    <p style="margin: 0; font-size: 22px; color: #1D1F22">Bonjour Guillaume</p>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; max-width: 760px">
      <div style="height: 120px; background: #FFFFFF; border: 1px solid #D9DCD6; border-radius: 6px"></div>
      <div style="height: 120px; background: #FFFFFF; border: 1px solid #D9DCD6; border-radius: 6px"></div>
      <div style="height: 120px; background: #FFFFFF; border: 1px solid #D9DCD6; border-radius: 6px"></div>
    </div>
  </div>

  <!-- Bandeau GuiVault -->
  <div class="inj inj-banner" role="dialog" aria-labelledby="sv">
    <div style="display: flex; align-items: center; gap: 10px; min-width: 0">
      <img src="/_blob/b5ba6fd6f3698d6072b814fdc9c6af28" alt="" width="22" height="22">
      <h2 id="sv" class="grow trunc" style="font-size: 15px; font-weight: 600">Enregistrer cet identifiant ?</h2>
      <button type="button" class="ibtn" aria-label="Fermer"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
    </div>
    <div class="card" style="display: flex; align-items: center; gap: 12px; padding: 10px 12px">
      <span class="tile h-teal">A</span>
      <span class="stack grow"><span class="trunc" style="font-weight: 500">atelier-nord.test</span><span class="trunc small muted">guillaume.lorin@exemple-entreprise.fr</span></span>
      <span class="mono small muted nowrap">••••••••</span>
    </div>
    <div style="display: flex; align-items: center; gap: 10px; min-width: 0">
      <span class="small muted nowrap">Dans</span>
      <span class="select-wrap grow"><select class="select" aria-label="Coffre" style="width: 100%"><option>Personnel</option><option>Équipe infrastructure et production</option><option>Famille</option></select><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></span>
    </div>
    <div style="display: flex; align-items: center; gap: 8px">
      <button type="button" class="btn btn-ghost" style="padding: 0 8px; color: var(--muted)">Jamais pour ce site</button>
      <span class="grow"></span>
      <button type="button" class="btn">Plus tard</button>
      <button type="button" class="btn btn-primary">Enregistrer</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":1200,"height":760}}'>
class Component extends DCLogic {
  renderVals() { return { theme: this.props.theme ?? 'dark' }; }
}
</script>
</body>
</html>
