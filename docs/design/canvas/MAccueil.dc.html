<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Mobile — accueil</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./theme.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="gv phone" data-theme="{{theme}}" style="font-family: 'Geist', system-ui, sans-serif">
  <header class="m-head">
    <img src="/_blob/b5ba6fd6f3698d6072b814fdc9c6af28" alt="" width="30" height="30">
    <h1 class="m-title trunc grow" style="font-size: 22px">Bonjour Guillaume</h1>
    <button type="button" class="m-icon m-icon-b" aria-label="Verrouiller"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg></button>
  </header>

  <div class="m-body">
    <a href="MRecherche.dc.html" class="m-search" style="text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg><span class="grow trunc">Rechercher dans 3 coffres</span></a>

    <div class="m-card" style="display: flex; align-items: center; gap: 12px; padding: 12px 14px">
      <span class="avatar h-orange" style="width: 36px; height: 36px">CL</span>
      <p class="grow clamp2" style="font-size: 14px"><b style="font-weight: 600">Camille</b> vous invite dans <b style="font-weight: 600">Famille</b></p>
      <button type="button" class="m-btn m-btn-primary" style="height: 40px; padding: 0 14px; font-size: 14px">Voir</button>
    </div>

    <section class="stack" style="gap: 10px">
      <div class="card-head" style="margin: 0"><h2 class="h2" style="font-size: 17px">Accès rapide</h2><a href="#" style="font-size: 14px">Modifier</a></div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
        <sc-for list="{{quick}}" as="q" hint-placeholder-count="4">
          <a href="MFiche.dc.html" class="m-card" style="display: flex; flex-direction: column; gap: 10px; padding: 14px; color: var(--text); text-decoration: none; min-width: 0">
            <span class="tile tile-md {{q.hue}}">{{q.initial}}</span>
            <span class="stack"><span class="trunc" style="font-weight: 600">{{q.name}}</span><span class="trunc small muted">{{q.sub}}</span></span>
          </a>
        </sc-for>
      </div>
    </section>

    <section class="m-card" style="padding: 6px 16px">
      <div style="display: flex; align-items: center; gap: 10px; min-height: 48px"><h2 class="h2 grow" style="font-size: 17px">Codes 2FA</h2>
        <svg width="20" height="20" viewBox="0 0 22 22" role="img" aria-label="18 secondes restantes"><circle cx="11" cy="11" r="8.5" fill="none" stroke="var(--line-2)" stroke-width="2.5"></circle><circle cx="11" cy="11" r="8.5" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-dasharray="32 53.4" stroke-linecap="round" transform="rotate(-90 11 11)"></circle></svg>
      </div>
      <div class="m-list">
        <button type="button" class="m-row" style="width: 100%; border: 0; background: none; text-align: left; min-height: 56px"><span class="grow trunc" style="font-weight: 500">GitHub</span><span class="mono" style="font-size: 20px; letter-spacing: 0.06em">346 067</span></button>
        <button type="button" class="m-row" style="width: 100%; border: 0; border-top: 1px solid var(--line); background: none; text-align: left; min-height: 56px"><span class="grow trunc" style="font-weight: 500">AWS Console — production</span><span class="mono" style="font-size: 20px; letter-spacing: 0.06em">556 231</span></button>
      </div>
    </section>

    <a href="MSante.dc.html" class="m-card" style="display: flex; align-items: center; gap: 14px; padding: 14px 16px; color: var(--text); text-decoration: none">
      <span class="nowrap"><span style="font-size: 26px; font-weight: 600">72</span><span class="muted"> /100</span></span>
      <span class="stack grow"><span style="font-weight: 500">Santé</span><span class="trunc small" style="color: var(--warn-text)">2 mots de passe réutilisés</span></span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
    </a>
  </div>

  <nav class="m-nav" aria-label="Principal">
    <a href="MAccueil.dc.html" class="m-tab" aria-current="page"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10.5L12 4l8 6.5V19a1 1 0 0 1-1 1h-4.5v-6h-5v6H5a1 1 0 0 1-1-1z"></path></svg>Accueil</a>
    <a href="MCoffre.dc.html" class="m-tab"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2.5"></rect><circle cx="12" cy="12" r="3.5"></circle></svg>Coffres</a>
    <a href="MCodes.dc.html" class="m-tab"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 7.5V12l3 2"></path></svg>Codes</a>
    <a href="MSante.dc.html" class="m-tab"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l7 3v5.5c0 4.5-3 7.8-7 9.5-4-1.7-7-5-7-9.5V6z"></path></svg>Santé</a>
    <a href="MParametres.dc.html" class="m-tab"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"></path><circle cx="16" cy="7" r="2"></circle><circle cx="10" cy="17" r="2"></circle></svg>Réglages</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const q = (name, sub, hue) => ({ name: name, sub: sub, hue: hue, initial: name.charAt(0).toUpperCase() });
    return {
      theme: this.props.theme ?? 'dark',
      quick: [q('GitHub', 'glorin', 'h-ink'), q('AWS Console — production', 'admin@infra.exemple-entreprise.fr', 'h-amber'), q('Boursorama', '12345678', 'h-pink'), q('Visa Premier', '•••• 7890', 'h-indigo')]
    };
  }
}
</script>
</body>
</html>
